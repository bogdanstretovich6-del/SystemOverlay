name: Build Android APK
on: [push, workflow_dispatch]
jobs:
build:
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v4
- name: set up JDK 17
uses: actions/setup-java@v4
with:
java-version: '17'
distribution: 'temurin'

- name: Bootstrap Native Android Project
run: |
mkdir -p app/src/main/java/com/system/overlay
mkdir -p app/src/main/assets
cp index.html app/src/main/assets/index.html
echo "include ':app'" > settings.gradle

cat << 'EOF' > build.gradle
buildscript {
repositories { google(); mavenCentral() }
dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
}
allprojects { repositories { google(); mavenCentral() } }
EOF

cat << 'EOF' > app/build.gradle
plugins { id 'com.android.application' }
android {
namespace 'com.system.overlay'
compileSdk 34
defaultConfig {
applicationId "com.system.overlay"
minSdk 21
targetSdk 34
versionCode 1
versionName "1.0"
}
}
EOF

cat << 'EOF' > app/src/main/AndroidManifest.xml
<?xml version="1.0" encoding="utf-8"?>
<manifest xmlns:android="http://android.com">
<uses-permission android:name="android.permission.INTERNET"/>
<application android:label="SystemOverlay" android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
<activity android:name=".MainActivity" android:exported="true">
<intent-filter>
<action android:name="android.intent.action.MAIN" />
<category android:name="android.intent.category.LAUNCHER" />
</intent-filter>
</activity>
</application>
</manifest>
EOF

cat << 'EOF' > app/src/main/java/com/system/overlay/MainActivity.java
package com.system.overlay;
import android.app.Activity;
import android.os.Bundle;
import android.webkit.WebView;
import android.webkit.WebViewClient;
import android.webkit.PermissionRequest;
import android.webkit.WebChromeClient;
public class MainActivity extends Activity {
@Override
protected void onCreate(Bundle savedInstanceState) {
super.onCreate(savedInstanceState);
WebView w = new WebView(this);
w.getSettings().setJavaScriptEnabled(true);
w.getSettings().setDomStorageEnabled(true);
w.getSettings().setMediaPlaybackRequiresUserGesture(false);
w.setWebChromeClient(new WebChromeClient() {
@Override
public void onPermissionRequest(final PermissionRequest r) { r.grant(r.getResources()); }
});
w.setWebViewClient(new WebViewClient());
w.loadUrl("file:///android_asset/index.html");
setContentView(w);
}
}
EOF

- name: Setup Gradle
uses: gradle/actions/setup-gradle@v3

- name: Build with Gradle
run: gradle assembleDebug

- name: Upload APK
uses: actions/upload-artifact@v4
with:
name: app-debug-apk
path: app/build/outputs/apk/debug/app-debug.apk
